grammar:
  # A1's governing condition is one unambiguous pair of nonnegative seconds.
  # The four listed examples are required coverage, not a closed whitelist.
  number: '(?:\d+(?:\.\d*)?|\.\d+)'
  left_boundary: '(?<![\w.+−-])'
  right_boundary: '(?![\w.:])'
  unit: '(?:seconds?|s|秒)'
  patterns:
    start_end: '\bSTART\s*=\s*(?P<start>{number})\s*,\s*END\s*=\s*(?P<end>{number}){right}'
    natural_language: '\b(?:starts|begins)\s+at\s+(?P<start>{number})\s+seconds?\b[^\d\n;]*?\bends\s+at\s+(?P<end>{number})\s+seconds?\b'
    from_to: '\bfrom\s+(?P<start>{number})\s+to\s+(?P<end>{number})\s+seconds?\b'
    dash_range: '{left}(?P<start>{number})\s*[–-]\s*(?P<end>{number})\s*{unit}(?!\w)'
    explicit_seconds_range: '\b(?:at|from)\s+(?P<start>{number})\s*{unit}\s+to\s+(?P<end>{number})\s*{unit}(?!\w)'
    explicit_start_end_respectively: '\bstart\s+and\s+end\s+times\s+are\s+(?P<start>{number})\s*{unit}\s+and\s+(?P<end>{number})\s*{unit}\s*,?\s*respectively\b'
  clock_pattern: '\d+(?:\.\d+)?\s*:\s*\d+'
  missing_unit_patterns:
    - '\b(?:starts|begins)\s+at\s+(?P<start>{number})(?:\s+seconds?)?\s*[^\d\n;]*?\bends\s+at\s+(?P<end>{number})(?:\s+seconds?)?'
    - '\bfrom\s+(?P<start>{number})\s+to\s+(?P<end>{number})(?:\s+seconds?)?'
    - '{left}(?P<start>{number})\s*[–-]\s*(?P<end>{number})'
    - '\b(?:at|from)\s+(?P<start>{number})(?:\s*{unit})?\s+to\s+(?P<end>{number})(?:\s*{unit})?'
    - '\bstart\s+and\s+end\s+times\s+are\s+(?P<start>{number})(?:\s*{unit})?\s+and\s+(?P<end>{number})(?:\s*{unit})?\s*,?\s*respectively\b'
  time_value_pattern: '{left}{number}\s*{unit}(?!\w)|\b(?:START|END)\s*=\s*{number}{right}'
  # Multiple applicable failures are retained, primary reason follows this order.
  failure_priority: [ambiguous_clock, multi_interval, missing_unit, single_point, no_interval]
  layer_a_failure_codes: [no_interval, single_point, multi_interval, missing_unit, ambiguous_clock]
  layer_b_codes: [valid, reverse_order, zero_duration]
  required_families: [start_end, natural_language, from_to, dash_range]
  distribution_layer_b: [valid, zero_duration]
